<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Page</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(2, 26, 18);
        }

        .a {
            background-color: rgb(48, 105, 86);
            margin: 20px;
            width: 80%;
            padding: 10px;
            justify-self: center;
            justify-items: center;
            border-radius: 20px;
            border: 4px solid rgb(69, 134, 94);
            box-shadow: 0px 6px 20px rgb(0, 0, 0);
        }

        .container {
            display: flex;
            justify-content: center;
        }

        .card {
            background-color: rgb(81, 163, 136);
            margin: 20px;
            width: 30%;
            padding: 10px;
            border-radius: 30px;
            border: 4px solid rgb(69, 134, 94);
            box-shadow: 0px 6px 20px rgb(0, 0, 0);
            height: 100%;
        }

        header {
            background-color: rgb(35, 77, 63);
            width: 95%;
            border-radius: 5px;
            padding: 5px;
            margin: 5px;
            justify-self: center;
            border: 4px solid rgb(69, 134, 94);
            box-shadow: 0px 6px 20px rgb(0, 0, 0);
        }

        h3 {
            background-color: rgb(100, 192, 161);
            border-radius: 20px;
            padding: 7px;
        }

        .price {
            background-color: rgb(0, 161, 81);
            border-radius: 10px;
            padding: 5px;
            border: 2px solid rgb(18, 156, 41);
        }
    </style>
</head>
<header>
    <img src="icons/home.svg" alt="">
    <a href="index.html" style="color: rgb(199, 223, 211)">Home Page</a><br>

    <img src="icons/shopping-bag.svg" alt="">
    <a href="product_page.html" style="color: rgb(199, 223, 211)">Product Page</a><br>

    <img src="icons/help-circle.svg" alt="">
    <a href="team_page.html" style="color: rgb(199, 223, 211)">Team Page</a>
</header>

<body>

    <div class="a">
        <h1>Pricing is based on usage per second.</h1>
        <h2>Same price for everyone, no different tiers or hidden costs.</h2>
    </div>

    <div class="container">

        <div class="card">
            <h3>ChatterBlast - Chat API</h3>
            <h2 class="price">$ 0.0015 per second</h2>
        </div>

        <div class="card">
            <h3>DreamWeaver - Image Generation API</h3>
            <h2 class="price">$ 0.0500 per second</h2>
        </div>

        <div class="card">
            <h3>MindReader - Image Recognition API</h3>
            <h2 class="price">$ 0.0350 per second</h2>
        </div>

    </div>


</body>

</html>
